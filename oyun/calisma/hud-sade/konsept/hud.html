<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--ink:#14182a;--glass:rgba(20,24,42,.82);--glass2:rgba(28,33,56,.9);--line:rgba(255,255,255,.14);--gold:#f2b632;--cream:#fff6e6;--money:#5fd27f;--txt:#f4f1ea;--mut:#aab0c4;
--disp:"Baloo 2","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:var(--body);color:var(--txt)}
.bg{position:absolute;inset:0;background:url(bg.png) center/cover;filter:brightness(1.12) saturate(1.05)}
.g{background:var(--glass);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(6px)}
/* shared top-left */
.tl{position:absolute;left:14px;top:12px;display:flex;gap:10px;align-items:center}
.lv{width:62px;height:62px;border-radius:50%;background:radial-gradient(#2a4fa8,#162a63);border:3px solid var(--gold);display:grid;place-items:center;font:800 28px var(--disp);position:relative}
.lv small{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font:900 10px var(--body);padding:1px 7px;border-radius:6px;letter-spacing:.06em}
.st{padding:8px 14px;display:grid;gap:2px}.st b{font:800 22px/1 var(--disp);color:var(--money)}.st span{font:800 13px var(--body);color:var(--mut)}
/* goal pill (collapsed hedefler) */
.goal{position:absolute;left:14px;top:96px;width:250px;padding:10px 12px}
.goal h4{margin:0 0 4px;font:900 11px var(--body);letter-spacing:.12em;color:var(--gold)}
.goal p{margin:0;font:800 15px/1.25 var(--body)}.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:64%;background:var(--money);border-radius:9px}
.tr{position:absolute;right:14px;top:12px;display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lab{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--gold);color:var(--ink);font:900 15px var(--body);padding:6px 16px;border-radius:999px;letter-spacing:.02em;box-shadow:0 3px 0 rgba(0,0,0,.3)}
/* A */
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:6px}
.dock a{width:86px;height:62px;border-radius:14px;display:grid;place-items:center;align-content:center;gap:2px;font:900 11px var(--body);letter-spacing:.08em;color:var(--txt)}
.dock a.on{background:rgba(255,255,255,.08)}
.badge{position:absolute;margin:-26px 0 0 30px;background:#e0533c;color:#fff;font:900 11px var(--body);border-radius:9px;padding:0 6px;border:2px solid var(--ink)}
.ctx{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:999px;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:900 15px var(--body)}
.ctx em{font-style:normal;font:800 12px var(--body);color:#6b5a48}
.ctx .chips{display:flex;gap:6px}.ctx .chips span{background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font:900 12px var(--body)}
/* B */
.mini{position:absolute;right:14px;top:66px;width:150px;height:150px;border-radius:50%;border:3px solid rgba(255,255,255,.85);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35);background:url(genel.png) 62% 22%/520px auto}
.mini:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--gold);border:3px solid #fff}
.mini b{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font:900 10px var(--body);background:var(--ink);padding:1px 8px;border-radius:6px;letter-spacing:.08em}
.phoneBtn{position:absolute;right:18px;bottom:18px;width:74px;height:74px;border-radius:22px;display:grid;place-items:center;align-content:center;gap:1px;font:900 10px var(--body);letter-spacing:.1em}
.phoneBtn svg{width:32px;height:32px}
.quick{position:absolute;right:102px;bottom:18px;display:flex;gap:8px}
.quick a{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;align-content:center;gap:1px;font:900 9px var(--body);letter-spacing:.08em}
.phone{position:absolute;right:30px;bottom:24px;width:330px;height:640px;border-radius:44px;background:#0d1020;border:3px solid #2c3352;box-shadow:0 20px 50px rgba(0,0,0,.5);padding:14px}
.scr{width:100%;height:100%;border-radius:32px;background:linear-gradient(170deg,#ffe7b0 0%,#f6b37a 45%,#7c6bb0 100%);padding:44px 18px 18px;position:relative;color:var(--ink)}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:90px;height:22px;border-radius:12px;background:#0d1020}
.clock{font:800 46px/1 var(--disp);text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.date{text-align:center;font:800 13px var(--body);color:#fff;margin-bottom:16px}
.widget{background:rgba(255,255,255,.85);border-radius:20px;padding:10px 12px;font:800 13px/1.3 var(--body);margin-bottom:16px}
.widget b{display:block;font:900 11px var(--body);letter-spacing:.1em;color:#a0522d}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.app{display:grid;justify-items:center;gap:5px;font:800 11.5px var(--body);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.app i{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.app i svg{width:30px;height:30px;stroke-width:2.2}
.dim{position:absolute;inset:0;background:rgba(10,12,24,.18)}
/* C */
.mm{position:absolute;left:16px;bottom:16px;width:170px;height:170px;border-radius:50%;border:3px solid rgba(255,255,255,.9);overflow:hidden;background:url(genel.png) 50% 18%/560px auto;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.mm:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--gold);border:3px solid #fff}
.mm .n{position:absolute;top:6px;left:50%;transform:translateX(-50%);font:900 12px var(--body)}
.act{position:absolute;right:20px;bottom:20px;width:112px;height:112px;border-radius:50%;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;align-content:center;gap:2px;font:900 13px var(--body);text-align:center}
.act svg{width:36px;height:36px;stroke-width:2.4}
.act em{font-style:normal;font:800 9px var(--body);max-width:90px}
.side{position:absolute;right:146px;bottom:22px;display:flex;flex-direction:column;gap:8px}
.side a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.ham{position:absolute;right:14px;top:12px}
.note{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font:800 12px var(--body);color:#fff;opacity:0}
</style></head><body>
<div class="bg"></div>
<div id="v"></div>
<script>
const I={map:'<svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
bag:'<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
note:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
shop:'<svg viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9h16v11H4zM4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0M10 20v-5h4v5"/></svg>',
bell:'<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2zM10 20a2 2 0 0 0 4 0"/></svg>',
gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>',
snd:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6"/></svg>',
key:'<svg viewBox="0 0 24 24"><circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M17 5l3 3"/></svg>',
user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
ppl:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c.8-3.5 3.5-5 7-5s6.2 1.5 7 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.3 2.2 4 5"/></svg>',
house:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg>',
star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5v1.5M12 16v1.5"/></svg>'};
const TOP=`<div class="tl"><div class="lv">12<small>ESNAF</small></div><div class="g st"><b>2.000.000 ₺</b><span>Gün 1 · 13:00 · Çarşamba</span></div></div>`;
const goal=`<div class="g goal"><h4>SIRADAKİ HEDEF</h4><p>Masa aç: sarı kareye yürü</p><div class="bar"><i></i></div></div>`;
const trBtns=`<div class="tr"><div class="g ib">${I.bell}</div><div class="g ib">${I.gear}</div></div>`;
const V={
A:`${TOP}${goal}${trBtns}<div class="lab">A · SADE ŞERİT</div>
<div class="ctx">${I.shop}<span>Sabri'nin Büfesi <em>· senin dükkânın</em></span><div class="chips"><span>Menü</span><span>Ekip</span><span>Tadilat</span></div></div>
<div class="g dock"><a>${I.map}HARİTA</a><a>${I.bag}ÇANTA</a><a>${I.note}<i class="badge">2</i>AJANDA</a><a>${I.menu}MENÜ</a></div>`,
B1:`${TOP}${goal}${trBtns.replace('<div class="tr">','<div class="tr" style="right:14px">')}<div class="lab">B · ESNAF TELEFONU (kapalı)</div><div class="mini"><b>HARİTA</b></div>
<div class="ctx" style="left:44%">${I.shop}<span>Büfem</span><div class="chips"><span>Menü</span><span>Ekip</span><span>Tadilat</span></div></div>
<div class="quick"><a class="g">${I.bag}ÇANTA</a></div><div class="g phoneBtn">${I.phone}<i class="badge" style="margin:-34px 0 0 40px">2</i>TELEFON</div>`,
B2:`${TOP}<div class="dim"></div><div class="lab">B · ESNAF TELEFONU (açık, oyun durmaz)</div>
<div class="phone"><div class="scr"><div class="notch"></div><div class="clock">13:00</div><div class="date">Çarşamba · 25 Kasım · 18°</div>
<div class="widget"><b>AJANDA · BUGÜN</b>Büfeden 30 ürün sat (12/30)<br>Kasım maaşlarını öde: yarın 09:00</div>
<div class="apps">
<div class="app"><i style="background:#3a8fd6">${I.map}</i>Harita</div>
<div class="app"><i style="background:#e0883a">${I.note}</i>Ajanda</div>
<div class="app"><i style="background:#8b5cc4">${I.house}</i>Mülklerim</div>
<div class="app"><i style="background:#3aa776">${I.coin}</i>Martı Kasa</div>
<div class="app"><i style="background:#d6513a">${I.ppl}</i>Arkadaşlar</div>
<div class="app"><i style="background:#c49a2a">${I.star}</i>Karne</div>
<div class="app"><i style="background:#4a5370">${I.user}</i>Karakter</div>
<div class="app"><i style="background:#6c7488">${I.gear}</i>Ayarlar</div>
<div class="app"><i style="background:#2f9fb0">${I.snd}</i>Müzik</div>
</div></div></div>`,
C:`${TOP}${goal}<div class="tr"><div class="g ib">${I.bell}</div><div class="g ib">${I.menu}</div></div><div class="lab">C · KÖŞE HUD (bar yok)</div>
<div class="mm"><span class="n">K</span></div>
<div class="side"><a class="g">${I.bag}</a><a class="g">${I.note}</a></div>
<div class="act">${I.shop}BÜFEM<em>menü · ekip<br>tadilat</em></div>`};
document.getElementById('v').innerHTML=V[new URLSearchParams(location.search).get('v')||'A'];
</script></body></html>
